[project]
name = "study-e2e-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pytest-html==4.1.1", "pytest-playwright==0.7.1"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

# pyproject.toml に追記

[tool.poe.tasks]
format = "uv run ruff format ."
lint = "uv run ruff check --fix ."
type-check = "uv run mypy ."

check = ["format", "lint", "type-check"]

[tool.mypy]
# __init__.py を置かない名前空間パッケージ構成のため、リポジトリルートを基準にモジュール名を解決する
explicit_package_bases = true
mypy_path = "."
